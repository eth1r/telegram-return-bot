version: '3.8'

services:
  return-bot:
    build: .
    container_name: return-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8003:8000"  # Web API (внешний порт 8003, внутренний 8000)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
